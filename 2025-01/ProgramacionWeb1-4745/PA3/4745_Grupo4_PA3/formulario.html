<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Búsqueda de Libros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2>Buscar libros</h2>
    <form id="formBusqueda" class="row g-3">

      <!-- Filtros -->
      <div class="col-md-4">
        <label class="form-label">Categoría</label>
        <select name="id_categoria" class="form-select">
          <option value="">-- Todas --</option>
          <option value="1">Novela</option>
          <option value="2">Ciencia</option>
          <option value="3">Infantil</option>
          <option value="4">Educativo</option>
          <option value="5">Autoayuda</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Autor</label>
        <input type="text" name="autor" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Stock mínimo</label>
        <input type="number" name="stock" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Fecha publicación desde</label>
        <input type="date" name="fecha_inicio" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Fecha publicación hasta</label>
        <input type="date" name="fecha_fin" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Precio mínimo</label>
        <input type="number" name="precio_min" step="0.01" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Precio máximo</label>
        <input type="number" name="precio_max" step="0.01" class="form-control">
      </div>

      <!-- Botón -->
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Buscar</button>
      </div>
    </form>

    <hr>

    <!-- Resultados -->
    <div id="resultado" class="mt-4"></div>
  </div>

  <!-- JS -->
  <script>
    let pagina = 1;
    let columna = 'titulo';
    let orden = 'ASC';

    function buscar() {
      const form = document.getElementById("formBusqueda");
      const formData = new FormData(form);
      formData.append("pagina", pagina);
      formData.append("columna", columna);
      formData.append("orden", orden);

      fetch("buscar.php", {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(data => document.getElementById("resultado").innerHTML = data)
      .catch(err => document.getElementById("resultado").innerHTML = `<div class="alert alert-danger">Error: ${err}</div>`);
    }

    document.getElementById("formBusqueda").addEventListener("submit", function(e) {
      e.preventDefault();
      pagina = 1;
      buscar();
    });

    function cambiarOrden(nuevaColumna) {
      if (columna === nuevaColumna) {
        orden = (orden === "ASC") ? "DESC" : "ASC";
      } else {
        columna = nuevaColumna;
        orden = "ASC";
      }
      buscar();
    }

    function cambiarPagina(p) {
      pagina = p;
      buscar();
    }

    window.onload = buscar;
  </script>
</body>
</html>
